name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main

permissions:
  id-token: write   # REQUIRED for OIDC
  contents: read

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install dependencies into package folder
      # - name: Install dependencies for Lambda
      #   run: |
      #     python -m pip install --upgrade pip
      #     python -m pip install pytest
      #     mkdir -p package
      #     if [ -f requirements.txt ]; then
      #         pip install -r requirements.txt -t package
      #     fi

      # Run tests before deployment
      - name: Run tests
        run: |
          python -m pip install pytest
          python -m pytest tests/

      # 4. Copy project files into package folder
      - name: Copy project files
        run: |
          cp *.py package/

      # 5. Create deployment ZIP
      - name: Zip deployment package
        run: |
          cd package
          zip -r ../lambda_deploy.zip .
          cd ..

      # Create Lambda layer for Pandas & NumPy to reduce deployment package size
      - name: Create Pandas Lambda Layer
        run: |
          mkdir -p python
          pip install pandas numpy -t python/
          zip -r pandas_layer.zip python

      # 6. Configure AWS credentials using OIDC
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::163368111864:role/role-githubdeploy-whenpoopbot
          aws-region: ap-southeast-1

      # 7. Publish Lambda Layer
      - name: Publish Lambda Layer
        id: publish_layer
        run: |
          LAYER_ARN=$(aws lambda publish-layer-version \
            --layer-name pandas-layer \
            --description "Pandas + NumPy layer" \
            --zip-file fileb://pandas_layer.zip \
            --compatible-runtimes python3.11 \
            --query 'LayerVersionArn' \
            --output text)
          echo "LAYER_ARN=$LAYER_ARN" >> $GITHUB_ENV
          
      # 8. Deploy to AWS Lambda
      - name: Deploy to Lambda
        run : |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://lambda_deploy.zip

      # 9. Attach Pandas layer to Lambda
      - name: Attach Pandas Layer
        run: |
          aws lambda update-function-configuration \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --layers $LAYER_ARN